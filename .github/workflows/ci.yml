name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Leak guards — fail the build if a secret, a real .onion, the dev's server,
  #    or a monorepo reference ever lands in a tracked file. These run first and
  #    are the reason CI is itself a safe-share requirement, not just credibility.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: No operator secrets tracked
        run: |
          if git ls-files | grep -EI 'nym\.txt$|turn\.env$|\.enc$|hs_ed25519_(secret|public)_key$|\.auth_private$|^onion/'; then
            echo "::error::a secret-shaped file is tracked — see .gitignore"; exit 1
          fi
          echo "no secret files tracked ✓"
      - name: No real v3 .onion literal (only placeholders)
        run: |
          if git grep -nE '[a-z2-7]{56}\.onion' -- ':!*.gitignore'; then
            echo "::error::a 56-char .onion literal is present — scrub it (use a placeholder)"; exit 1
          fi
          echo "no real .onion literal ✓"
      - name: No dev host / credentials / monorepo refs
        run: |
          if git grep -nE '84\.22\.115\.187|ldex-mono|/home/[a-z]+/' -- ':!.github/workflows/ci.yml'; then
            echo "::error::a server IP, monorepo ref, or absolute home path is tracked"; exit 1
          fi
          echo "no host/cred/monorepo refs ✓"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --all-features

  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci   # no `|| npm install` fallback — a lockfile drift must fail loudly, not silently un-pin
      - run: npm test            # tools/smoke.mjs — 10 checks
      - run: npm pack --dry-run   # exercises prepack/bundle + postpack/clean

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: bash -n
        run: for s in scripts/*.sh; do bash -n "$s"; done
      - name: shellcheck (errors only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S error scripts/*.sh

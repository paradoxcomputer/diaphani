[package]
name = "diaphani-explorer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Read-only Logos chain explorer that talks to a Diaphani-fronted node over its Tor .onion — a reference consumer of diaphani-client."

[[bin]]
name = "diaphani-explorer"
path = "src/main.rs"

[dependencies]
diaphani-client = { path = "../client" }   # read-only by default (no `node-wallet` feature)
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"
serde_json = "1"
